# Request path/query redaction for access logs. Reset, verify, confirm and unsubscribe links carry
# one-time tokens in the path or the query string, and click/open/unsubscribe tracking tokens
# are in the path. None of them may reach the logs: tracking paths keep only their prefix and every
# query string is dropped. The Referer header is not logged at all.
map $request_uri $loggable_uri {
  ~^(?<keep>/api/v1/tracking/(?:click|open|unsubscribe)/)  "${keep}[redacted]";
  ~^(?<path>[^?]*)\?                                       "${path}?[redacted]";
  default                                                  $request_uri;
}

log_format mailpulse '$remote_addr xff="$http_x_forwarded_for" [$time_iso8601] '
                     '"$request_method $loggable_uri" $status $body_bytes_sent '
                     'rt=$request_time urt="$upstream_response_time"';

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/nginx/access.log mailpulse;
  # The error log prints the full request line (including tokens) when an upstream fails, and
  # nginx cannot redact it, so only critical entries are kept here. Startup and configuration
  # errors are still reported by the main error log. Failed requests stay visible in the access log.
  error_log /var/log/nginx/error.log crit;

  # Slow-client protection (slowloris). Upstream timeouts are set in the /api/ block.
  client_header_timeout 15s;
  client_body_timeout 15s;
  send_timeout 30s;

  # Docker's embedded DNS server. With a literal `proxy_pass http://server:5000;` nginx resolves
  # the name ONCE at startup, so after the server container restarts (new IP) every /api/ call
  # fails with 502 until nginx is restarted. Using a variable in proxy_pass makes nginx resolve the
  # name at request time through this resolver, honouring the short cache below.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Container health check target (the server's own readiness is checked by its container).
  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The liveness probe includes runtime diagnostics (Node version, memory); keep it internal.
  # Use /api/v1/health/ready for external monitoring.
  location = /api/v1/health {
    return 404;
  }

  # API and webhooks go to the Node server (the service name comes from docker-compose).
  # The upstream is a fixed name, never derived from the request, so this is not an open proxy.
  # With a variable and no URI in proxy_pass, nginx forwards the original request URI
  # unchanged, query string included.
  location /api/ {
    set $api_upstream http://server:5000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
  }

  # Single-page app: unknown paths fall back to index.html.
  # Security headers live here (not on /api/, where the API sends its own via Helmet).
  # The CSP assumes the API is same-origin (/api/v1, as built by client/Dockerfile); if you point
  # VITE_API_BASE_URL at another origin, add it to connect-src.
  location / {
    try_files $uri $uri/ /index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Reset, verify and confirm links carry one-time tokens in the URL: never leak them in Referer
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # img-src allows https: because the sandboxed email preview (a srcdoc iframe) inherits this
    # policy and campaign HTML may reference remote images. Scripts are limited to our own bundle.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
