server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API and webhooks go to the Node server (the service name comes from docker-compose).
  location /api/ {
    proxy_pass http://server:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
  }

  # Single-page app: unknown paths fall back to index.html.
  # Security headers live here (not on /api/, where the API sends its own via Helmet).
  # The CSP assumes the API is same-origin (/api/v1, as built by client/Dockerfile); if you point
  # VITE_API_BASE_URL at another origin, add it to connect-src.
  location / {
    try_files $uri $uri/ /index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Reset, verify and confirm links carry one-time tokens in the URL: never leak them in Referer
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # img-src allows https: because the sandboxed email preview (a srcdoc iframe) inherits this
    # policy and campaign HTML may reference remote images. Scripts are limited to our own bundle.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
